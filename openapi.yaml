openapi: 3.0.3
info:
  title: Notification System API
  description: Event-Driven Notification System for sending SMS, Email, and Push notifications
  version: 1.0.0
  contact:
    name: Insider One
    email: support@insiderone.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

paths:
  /notifications:
    post:
      summary: Create a notification
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Notification created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

    get:
      summary: List notifications with filtering and pagination
      tags:
        - Notifications
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, sent, failed, cancelled]
        - name: channel
          in: query
          schema:
            type: string
            enum: [sms, email, push]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 15
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications/batch:
    post:
      summary: Create multiple notifications (up to 1000)
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreateRequest'
      responses:
        '201':
          description: Batch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        '422':
          description: Validation error

  /notifications/{id}:
    get:
      summary: Get notification by ID
      tags:
        - Notifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          description: Notification not found

  /notifications/{id}/cancel:
    post:
      summary: Cancel a pending notification
      tags:
        - Notifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification cancelled successfully
        '400':
          description: Cannot cancel notification
        '404':
          description: Notification not found

  /notifications/batch/{batchId}:
    get:
      summary: Get all notifications in a batch
      tags:
        - Notifications
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Batch notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  total:
                    type: integer

  /metrics:
    get:
      summary: Get real-time system metrics
      tags:
        - Observability
      responses:
        '200':
          description: System metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /health:
    get:
      summary: Health check endpoint
      tags:
        - Observability
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System is unhealthy

components:
  schemas:
    CreateNotificationRequest:
      type: object
      required:
        - recipient
        - channel
        - content
      properties:
        recipient:
          type: string
          description: Phone number, email, or device token
          example: "+905551234567"
        channel:
          type: string
          enum: [sms, email, push]
          example: sms
        content:
          type: string
          description: Message content
          example: "Your verification code is 123456"
        priority:
          type: string
          enum: [high, normal, low]
          default: normal
        idempotency_key:
          type: string
          description: Optional key to prevent duplicate sends

    BatchCreateRequest:
      type: object
      required:
        - notifications
      properties:
        notifications:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CreateNotificationRequest'

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        batch_id:
          type: string
          format: uuid
          nullable: true
        idempotency_key:
          type: string
        recipient:
          type: string
        channel:
          type: string
          enum: [sms, email, push]
        content:
          type: string
        priority:
          type: string
          enum: [high, normal, low]
        status:
          type: string
          enum: [pending, processing, sent, failed, cancelled]
        external_message_id:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        retry_count:
          type: integer
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Notification'

    NotificationListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          type: object
          properties:
            total:
              type: integer
            per_page:
              type: integer
            current_page:
              type: integer
            last_page:
              type: integer
            from:
              type: integer
            to:
              type: integer

    BatchResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            batch_id:
              type: string
              format: uuid
            notifications:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
            total:
              type: integer

    MetricsResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        queue_depth:
          type: object
          properties:
            high:
              type: integer
            default:
              type: integer
            low:
              type: integer
            total:
              type: integer
        success_failure_rates:
          type: object
          properties:
            total:
              type: integer
            sent:
              type: integer
            failed:
              type: integer
            success_rate:
              type: number
            failure_rate:
              type: number
        latency:
          type: object
          properties:
            average_seconds:
              type: number
        channels:
          type: object
        rate_limits:
          type: object

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          properties:
            database:
              type: object
            redis:
              type: object
            queue:
              type: object

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object

tags:
  - name: Notifications
    description: Notification management endpoints
  - name: Observability
    description: Metrics and health check endpoints
