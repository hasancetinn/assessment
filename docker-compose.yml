version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - notification-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: notification-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - notification-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: notification-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: notification_system
      MYSQL_USER: notification_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - notification-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: notification-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - notification-network
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --queue=high,default,low --tries=3 --backoff=60 --sleep=3
    volumes:
      - ./:/var/www/html
    networks:
      - notification-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notification-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./:/var/www/html
    networks:
      - notification-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

networks:
  notification-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
